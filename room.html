<!doctype html>
<html lang="ko" class="room">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room — Lee Seoeun</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Lee Seoeun Portfolio">
<meta property="og:title" content="Read the Room — Lee Seoeun">
<meta property="og:description" content="이서은 UX/UI 포트폴리오 — 보고, 읽고, 시청하는 작업물">
<meta property="og:url" content="https://leeseoeuns.github.io/">
<meta property="og:image" content="https://leeseoeuns.github.io/assets/og.png?v=3">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://leeseoeuns.github.io/assets/og.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{var c=JSON.parse(sessionStorage.getItem("curtain")||"null");if(c&&c.m==="w"){document.documentElement.classList.add("arr-w");document.documentElement.style.setProperty("--arr",c.c||"#111")}}catch(e){}</script>
<link rel="stylesheet" href="css/style.css?v=1029r">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='%23504AFA'/%3E%3C/svg%3E">
</head>
<body>
<div class="progress"><i id="bar"></i></div>

<aside class="side">
  <a class="back link" href="index.html#archive" data-go data-text="← Archive"><span>← Archive</span></a>
  <div>
    <p class="room-no" id="roomNo"></p>
    <h1 id="roomEn"></h1>
    <p class="ko" id="roomKo"></p>
  </div>
  <p class="meta" id="roomMeta"></p>
  <a class="pill live kr" id="roomLink" target="_blank" rel="noopener" hidden>사이트 바로가기 ↗</a>
  <ol class="chapters" id="chapters"></ol>
  <div class="modebar">
    <button class="pill is-on" data-mode="book">Book</button>
    <button class="pill" data-mode="docent">Docent <i class="dot"></i></button>
    <button class="pill" data-mode="screening">Screening <i class="dot"></i></button>
  </div>
</aside>

<main class="read">
  <div class="book" id="book"></div>
  <div class="end">
    <a class="pill live kr" id="roomLink2" target="_blank" rel="noopener" hidden>사이트 바로가기 ↗</a>
    <small id="endTxt"></small>
    <a class="next-room" id="nextRoom" data-go></a>
  </div>
</main>

<!-- Docent: one page under the light, with a guide's voice -->
<section class="overlay docent" id="docent" aria-label="Docent mode">
  <div class="ov-top"><span class="ttl" id="dTitle"></span><span style="display:flex;gap:10px"><button class="pill voice" id="voice" aria-label="읽어주기 목소리 켜기/끄기"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="w" d="M11 5.5c1 .8 1 4.2 0 5M12.8 3.8c2 1.7 2 6.7 0 8.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg><span class="vt">목소리 켜짐</span></button><button class="pill" data-close>Close</button></span></div>
  <div class="stage"><img id="dImg" alt=""></div>
  <div class="panel">
    <span class="cnt" id="dCnt"></span>
    <h3 id="dHead"></h3>
    <p id="dBody"></p>
  </div>
  <div class="ctrl"><button class="prev" id="dPrev">← Prev</button><div class="track"><i id="dTrack"></i></div><button class="nextb" id="dNext">Next →</button></div>
</section>

<!-- Screening: sit back, it plays -->
<section class="overlay screening" id="screening" aria-label="Screening mode">
  <div class="ov-top"><span class="ttl" id="sTitle"></span><button class="pill" data-close>Close</button></div>
  <div class="screen" id="screen"></div>
  <p class="sub" id="sub"><span></span></p>
  <div class="segs" id="segs"></div>
  <div class="scr-info"><span id="sNow"></span><button id="sPlay">❚❚ Pause</button></div>
  <div class="fin" id="fin"><h4>Fin.</h4><a class="pill" id="finNext" data-go style="border-color:#fff;color:#fff"></a><button class="pill" id="finAgain" style="border-color:rgba(255,255,255,.5);color:#fff">Replay</button></div>
</section>

<script src="js/shapes.js?v=1029r"></script>
<script src="js/common.js?v=1029r"></script>
<script src="js/data.js?v=1029r"></script>
<script src="js/room.js?v=1029r"></script>
</body>
</html>
